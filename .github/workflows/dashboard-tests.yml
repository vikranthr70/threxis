name: THREXIS dashboard tests
on:
  push:
    branches: ["feature/ubuntu-live-demo"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py src tests
      - name: Run all tests
        run: python -m pytest -q --tb=short
