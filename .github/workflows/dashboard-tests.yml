name: THREXIS dashboard tests
on:
  push:
    branches: ["feature/ubuntu-live-demo"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py src tests
      - name: Run all tests
        shell: bash
        run: |
          python -m pytest -q --tb=short --junitxml=pytest-results.xml || result=$?
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("pytest-results.xml")
          if report.exists():
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  for fail in list(case.findall("failure")) + list(case.findall("error")):
                      message = (fail.text or fail.attrib.get("message", "test failure")).replace("\\n", " ")
                      print(f"::error title={case.attrib.get('name','test')}::{message[:3500]}")
          PY
          exit ${result:-0}
      - name: Post failing test summary to integration PR
        if: failure() && github.ref == 'refs/heads/feature/ubuntu-live-demo'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY' > ci-test-summary.txt
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("pytest-results.xml").getroot()
          print("Automated dashboard regression failures (CI):")
          for case in root.iter("testcase"):
              for failure in list(case.findall("failure")) + list(case.findall("error")):
                  print("\\n" + case.attrib.get("classname", "") + "." + case.attrib.get("name", ""))
                  print((failure.text or failure.attrib.get("message", ""))[-1800:])
          PY
          gh api repos/${{ github.repository }}/issues/7/comments -f body="$(head -c 15000 ci-test-summary.txt)"

